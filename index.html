<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SATS - QR Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode"
  ></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      color: #6b7280;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 20px;
      box-shadow:
        0 5px 25px rgba(0,0,0,0.08);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      color: #6b7280;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #dcfce7;
      color: #166534;
      text-align: center;
      font-weight: bold;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1>🏫 SATS</h1>

    <p>
      Sistem Kehadiran Murid
    </p>

  </div>


  <div class="card">

    <div id="reader"></div>

    <div
      id="scannerStatus"
      class="status"
    >
      Memulakan kamera...
    </div>


    <div
      id="result"
      class="result"
    ></div>

  </div>

</div>


<script>

  let scanner;


  function startScanner() {

    scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },


     function(decodedText) {

  sendQRToSATS(decodedText);

},


      function(errorMessage) {

        // Normal scanning errors
        // are ignored.

      }

    )

    .then(function() {

      document
        .getElementById(
          "scannerStatus"
        )
        .innerText =
        "Kamera sedia. Sila imbas QR.";

    })

    .catch(function(error) {

      console.error(error);


      document
        .getElementById(
          "scannerStatus"
        )
        .innerText =
        "Kamera tidak dapat dibuka.";

    });

  }

/* ==================================================
   SEND QR TO SATS BACKEND
   ================================================== */

function sendQRToSATS(qrCode) {

  const result =
    document.getElementById(
      "result"
    );


  const status =
    document.getElementById(
      "scannerStatus"
    );


  result.style.display =
    "block";


  result.innerText =
    "Menyemak murid...";


  status.innerText =
    "Menghubungi SATS...";


  /*
   * Create a unique JSONP callback.
   */

  const callbackName =
    "satsCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      try {

        displayAttendanceResult(
          data
        );

      } finally {

        delete window[
          callbackName
        ];

      }

    };


  const script =
    document.createElement(
      "script"
    );


  /*
   * IMPORTANT:
   * Replace this URL with your
   * Apps Script Web App URL.
   */

  const API_URL =
    "https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbxmq-vR8ITXiLjgZn3Gyezmr2vbC5iIghWrY-MpRR4j2Q6LA0K1BOJb3hXXVswG6ZFe/exec";


  script.src =
    API_URL +
    "?action=scan" +
    "&qr=" +
    encodeURIComponent(
      qrCode
    ) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      result.innerText =
        "Ralat sambungan SATS.";


      status.innerText =
        "Tidak dapat menghubungi server.";

      delete window[
        callbackName
      ];

    };


  document
    .body
    .appendChild(
      script
    );

}


/* ==================================================
   DISPLAY SATS RESULT
   ================================================== */

function displayAttendanceResult(
  data
) {

  const result =
    document.getElementById(
      "result"
    );


  const status =
    document.getElementById(
      "scannerStatus"
    );


  if (
    data.success
  ) {

    result.innerHTML =

      "✓ HADIR<br><br>" +

      "<strong>" +
      escapeHtml(
        data.student.name
      ) +
      "</strong><br>" +

      "ID: " +
      escapeHtml(
        data.student.id
      ) +
      "<br>" +

      "Kelas " +
      escapeHtml(
        data.student.className
      ) +
      "<br><br>" +

      data.date +
      " • " +
      data.time;


    status.innerText =
      "Kehadiran berjaya direkodkan.";

    return;

  }


  if (
    data.type ===
    "duplicate"
  ) {

    result.innerHTML =

      "⚠ SUDAH DIREKOD<br><br>" +

      "<strong>" +
      escapeHtml(
        data.student.name
      ) +
      "</strong><br>" +

      "ID: " +
      escapeHtml(
        data.student.id
      ) +
      "<br>" +

      "Kelas " +
      escapeHtml(
        data.student.className
      ) +
      "<br><br>" +

      "Scan pertama: " +
      escapeHtml(
        data.existingTime
      );


    status.innerText =
      "Murid ini sudah mempunyai rekod hari ini.";

    return;

  }


  if (
    data.type ===
    "not_found"
  ) {

    result.innerHTML =

      "✕ MURID TIDAK DIJUMPAI<br><br>" +

      "QR: " +
      escapeHtml(
        data.qrCode
      );


    status.innerText =
      "QR Code tidak terdapat dalam Data Murid.";

    return;

  }


  result.innerText =
    data.message ||
    "Ralat SATS.";


  status.innerText =
    "Ralat berlaku.";

}


/* ==================================================
   BASIC HTML ESCAPE
   ================================================== */

function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
  startScanner();

</script>

</body>

</html>
