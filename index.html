<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SATS - QR Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode"
  ></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      color: #6b7280;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 20px;
      box-shadow:
        0 5px 25px rgba(0,0,0,0.08);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      color: #6b7280;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #dcfce7;
      color: #166534;
      text-align: center;
      font-weight: bold;
    }
/* =========================
   DATA MURID
   ========================= */

.form-input {

  width: 100%;

  padding: 13px;

  border: 1px solid #d1d5db;

  border-radius: 10px;

  margin-top: 10px;

  font-size: 16px;

  outline: none;

}


.form-input:focus {

  border-color: #111827;

}


.student-card {

  background: white;

  border-radius: 16px;

  padding: 16px;

  margin-bottom: 12px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,0.06);

}


.student-card-name {

  font-size: 19px;

  font-weight: bold;

}


.student-card-info {

  margin-top: 5px;

  color: #6b7280;

  font-size: 14px;

}


.student-qr {

  width: 120px;

  height: 120px;

  object-fit: contain;

  margin-top: 12px;

}


.student-actions {

  display: flex;

  gap: 8px;

  margin-top: 12px;

}


.student-actions button {

  flex: 1;

  border: none;

  border-radius: 9px;

  padding: 10px;

  cursor: pointer;

  font-weight: bold;

}


.edit-button {

  background: #e5e7eb;

}


.delete-button {

  background: #fee2e2;

  color: #991b1b;

}
  </style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1>🏫 SATS</h1>

    <p>
      Sistem Kehadiran Murid
    </p>

  </div>


  <div class="card">

    <div id="reader"></div>

    <div
      id="scannerStatus"
      class="status"
    >
      Memulakan kamera...
    </div>


    <div
      id="result"
      class="result"
    ></div>

  </div>

</div>


<script>

  let scanner;


  function startScanner() {

    scanner =
      new Html5Qrcode("reader");


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },


     function(decodedText) {

  sendQRToSATS(decodedText);

},


      function(errorMessage) {

        // Normal scanning errors
        // are ignored.

      }

    )

    .then(function() {

      document
        .getElementById(
          "scannerStatus"
        )
        .innerText =
        "Kamera sedia. Sila imbas QR.";

    })

    .catch(function(error) {

      console.error(error);


      document
        .getElementById(
          "scannerStatus"
        )
        .innerText =
        "Kamera tidak dapat dibuka.";

    });

  }
  /* ==================================================
   DATA MURID
   ================================================== */

let allStudents = [];


/**
 * Load students.
 */
function loadStudents() {

  google.script.run

    .withSuccessHandler(
      function(students) {

        allStudents =
          students || [];

        displayStudents(
          allStudents
        );

      }
    )

    .withFailureHandler(
      function(error) {

        alert(
          'Gagal memuatkan data murid: ' +
          error.message
        );

      }
    )

    .getStudents();

}


/**
 * Display student list.
 */
function displayStudents(
  students
) {

  const container =
    document.getElementById(
      'studentList'
    );


  container.innerHTML = '';


  if (
    students.length === 0
  ) {

    container.innerHTML =

      '<div class="card">' +
      'Tiada data murid.' +
      '</div>';

    return;

  }


  students.forEach(
    function(student) {

      const qrUrl =
        'https://quickchart.io/qr' +
        '?text=' +
        encodeURIComponent(
          student.id
        ) +
        '&size=200';


      const card =
        document.createElement(
          'div'
        );


      card.className =
        'student-card';


      card.innerHTML =

        '<div class="student-card-name">' +
        escapeHtml(
          student.name
        ) +
        '</div>' +

        '<div class="student-card-info">' +
        'ID: ' +
        escapeHtml(
          student.id
        ) +
        '</div>' +

        '<div class="student-card-info">' +
        'Kelas: ' +
        escapeHtml(
          student.className
        ) +
        '</div>' +

        '<img ' +
        'class="student-qr" ' +
        'src="' +
        qrUrl +
        '" ' +
        'alt="QR Code">' +

        '<div class="student-actions">' +

        '<button ' +
        'class="edit-button" ' +
        'onclick="editStudent(\'' +
        escapeJs(
          student.id
        ) +
        '\')">' +
        '✏️ Edit' +
        '</button>' +

        '<button ' +
        'class="delete-button" ' +
        'onclick="removeStudent(\'' +
        escapeJs(
          student.id
        ) +
        '\')">' +
        '🗑️ Padam' +
        '</button>' +

        '</div>';


      container.appendChild(
        card
      );

    }
  );

}


/**
 * Add student.
 */
function addNewStudent() {

  const id =
    document
      .getElementById(
        'studentIdInput'
      )
      .value
      .trim();


  const name =
    document
      .getElementById(
        'studentNameInput'
      )
      .value
      .trim();


  const className =
    document
      .getElementById(
        'studentClassInput'
      )
      .value
      .trim();


  if (
    !id ||
    !name ||
    !className
  ) {

    alert(
      'Sila lengkapkan semua maklumat murid.'
    );

    return;

  }


  google.script.run

    .withSuccessHandler(
      function(result) {

        alert(
          result.message
        );


        document
          .getElementById(
            'studentIdInput'
          )
          .value = '';


        document
          .getElementById(
            'studentNameInput'
          )
          .value = '';


        document
          .getElementById(
            'studentClassInput'
          )
          .value = '';


        loadStudents();

      }
    )

    .withFailureHandler(
      function(error) {

        alert(
          error.message
        );

      }
    )

    .addStudent(
      id,
      name,
      className
    );

}


/**
 * Search students.
 */
function filterStudents() {

  const query =
    document
      .getElementById(
        'studentSearch'
      )
      .value
      .trim()
      .toLowerCase();


  if (!query) {

    displayStudents(
      allStudents
    );

    return;

  }


  const filtered =
    allStudents.filter(
      function(student) {

        return (

          student.id
            .toLowerCase()
            .includes(query)

          ||

          student.name
            .toLowerCase()
            .includes(query)

          ||

          student.className
            .toLowerCase()
            .includes(query)

        );

      }
    );


  displayStudents(
    filtered
  );

}


/**
 * Delete student.
 */
function removeStudent(
  studentId
) {

  const confirmed =
    confirm(
      'Padam murid ' +
      studentId +
      '?'
    );


  if (!confirmed) {
    return;
  }


  google.script.run

    .withSuccessHandler(
      function(result) {

        alert(
          result.message
        );

        loadStudents();

      }
    )

    .withFailureHandler(
      function(error) {

        alert(
          error.message
        );

      }
    )

    .deleteStudent(
      studentId
    );

}


/**
 * Edit student.
 *
 * Temporary simple version.
 * We will replace this with a proper
 * edit form in the next refinement.
 */
function editStudent(
  studentId
) {

  const student =
    allStudents.find(
      function(item) {

        return (
          item.id ===
          studentId
        );

      }
    );


  if (!student) {
    return;
  }


  const name =
    prompt(
      'Nama Murid:',
      student.name
    );


  if (
    name === null
  ) {
    return;
  }


  const className =
    prompt(
      'Kelas:',
      student.className
    );


  if (
    className === null
  ) {
    return;
  }


  google.script.run

    .withSuccessHandler(
      function(result) {

        alert(
          result.message
        );

        loadStudents();

      }
    )

    .withFailureHandler(
      function(error) {

        alert(
          error.message
        );

      }
    )

    .updateStudent(
      studentId,
      name,
      className
    );

}


/**
 * Escape HTML.
 */
function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/**
 * Escape JavaScript string.
 */
function escapeJs(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /\\/g,
      '\\\\'
    )
    .replace(
      /'/g,
      "\\'"
    );

}

/* ==================================================
   SEND QR TO SATS BACKEND
   ================================================== */

function sendQRToSATS(qrCode) {

  const result =
    document.getElementById(
      "result"
    );


  const status =
    document.getElementById(
      "scannerStatus"
    );


  result.style.display =
    "block";


  result.innerText =
    "Menyemak murid...";


  status.innerText =
    "Menghubungi SATS...";


  /*
   * Create a unique JSONP callback.
   */

  const callbackName =
    "satsCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      try {

        displayAttendanceResult(
          data
        );

      } finally {

        delete window[
          callbackName
        ];

      }

    };


  const script =
    document.createElement(
      "script"
    );


  /*
   * IMPORTANT:
   * Replace this URL with your
   * Apps Script Web App URL.
   */

  const API_URL =
    "https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbxmq-vR8ITXiLjgZn3Gyezmr2vbC5iIghWrY-MpRR4j2Q6LA0K1BOJb3hXXVswG6ZFe/exec";


  script.src =
    API_URL +
    "?action=scan" +
    "&qr=" +
    encodeURIComponent(
      qrCode
    ) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      result.innerText =
        "Ralat sambungan SATS.";


      status.innerText =
        "Tidak dapat menghubungi server.";

      delete window[
        callbackName
      ];

    };


  document
    .body
    .appendChild(
      script
    );

}


/* ==================================================
   DISPLAY SATS RESULT
   ================================================== */

function displayAttendanceResult(
  data
) {

  const result =
    document.getElementById(
      "result"
    );


  const status =
    document.getElementById(
      "scannerStatus"
    );


  if (
    data.success
  ) {

    result.innerHTML =

      "✓ HADIR<br><br>" +

      "<strong>" +
      escapeHtml(
        data.student.name
      ) +
      "</strong><br>" +

      "ID: " +
      escapeHtml(
        data.student.id
      ) +
      "<br>" +

      "Kelas " +
      escapeHtml(
        data.student.className
      ) +
      "<br><br>" +

      data.date +
      " • " +
      data.time;


    status.innerText =
      "Kehadiran berjaya direkodkan.";

    return;

  }


  if (
    data.type ===
    "duplicate"
  ) {

    result.innerHTML =

      "⚠ SUDAH DIREKOD<br><br>" +

      "<strong>" +
      escapeHtml(
        data.student.name
      ) +
      "</strong><br>" +

      "ID: " +
      escapeHtml(
        data.student.id
      ) +
      "<br>" +

      "Kelas " +
      escapeHtml(
        data.student.className
      ) +
      "<br><br>" +

      "Scan pertama: " +
      escapeHtml(
        data.existingTime
      );


    status.innerText =
      "Murid ini sudah mempunyai rekod hari ini.";

    return;

  }


  if (
    data.type ===
    "not_found"
  ) {

    result.innerHTML =

      "✕ MURID TIDAK DIJUMPAI<br><br>" +

      "QR: " +
      escapeHtml(
        data.qrCode
      );


    status.innerText =
      "QR Code tidak terdapat dalam Data Murid.";

    return;

  }


  result.innerText =
    data.message ||
    "Ralat SATS.";


  status.innerText =
    "Ralat berlaku.";

}


/* ==================================================
   BASIC HTML ESCAPE
   ================================================== */

function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
  startScanner();

</script>

</body>

</html>
loadSettings();

loadStudents();

startScanner();
